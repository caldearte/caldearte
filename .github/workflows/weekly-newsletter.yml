name: Send Weekly Newsletter

# Weekly digest to confirmed newsletter subscribers — see
# docs/data-model.md's newsletter_subscribers entry and
# docs/roadmap.md's newsletter section for the full design.
#
# Since 2026-10-18: a Thursday-MORNING edition covering Thursday to Sunday
# (2026-10-16 to 10-18 it was Thursday 19:00, Friday-Sunday) — Thursday is
# the busiest opening day and most of its openings start 17:00-19:00, so an
# evening send arrived too late for them. Every Santiago Thursday opening
# known in advance was already in by Wednesday night, and Friday-Sunday
# coverage barely changes between Thursday 08:00 and 19:00 (34 vs 36 of 48
# over 13 weeks). See apps/curator/src/newsletter/run.ts
# (editionBoundsInSantiago; it only sends Thursday-Saturday). Earlier
# history: a Sunday digest of the whole week (moved Monday -> Sunday
# 2026-08-23).
#
# Timing: same approach as publish-social.yml — a cron well before the
# target, then a wait step. GitHub's morning-UTC crons run 4-10 h late
# (instagram-bright-sources 08:17 UTC started 12:13-17:59 UTC over the last
# 30 runs), but the night slots barely slip (cron-watchdog's 04:40 UTC run
# started 04:56-06:28 UTC). So the cron fires ~04:47 UTC and waits until
# 09:00 in Santiago. The wait is capped at 5h40m (GitHub's 6h job limit), so
# an on-time start actually sends ~07:40 (summer time) / ~06:40 (winter);
# any start between ~06:20 and 12:00 UTC sends at 09:00 or right away —
# before noon either way.
on:
  workflow_dispatch: {}
  schedule:
    # Not minute 0 — see event-discovery.yml's own comment (top-of-hour
    # congestion, real 26-51min delays observed 2026-08-23).
    # 04:47 UTC = 01:47 Santiago in summer time, 00:47 in winter — the
    # wait step below targets 09:00 in Santiago either way.
    - cron: "47 4 * * 4" # Every Thursday

permissions:
  contents: read

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    # GitHub's own limit; the wait below is capped well under it.
    timeout-minutes: 360
    steps:
      # Only on the schedule — a manual or watchdog dispatch sends at once.
      # Capped at 5h40m so a punctual GitHub can't push the job past its
      # 6h limit. After 09:00 there's no wait.
      - name: Wait until 09:00 in Santiago
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=America/Santiago date -d "09:00" +%s)
          wait=$(( target - $(date +%s) ))
          max=$(( 5 * 3600 + 40 * 60 ))
          if [ "$wait" -gt "$max" ]; then wait=$max; fi
          if [ "$wait" -gt 0 ]; then
            echo "Started $(TZ=America/Santiago date +%H:%M) Santiago; waiting $(( wait / 60 )) min."
            sleep "$wait"
          else
            echo "Started $(TZ=America/Santiago date +%H:%M) Santiago, past 09:00 — no wait."
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Send the Thursday-Sunday newsletter
        run: pnpm --filter @caldearte/curator run send-newsletter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
