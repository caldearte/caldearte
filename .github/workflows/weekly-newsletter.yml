name: Send Weekly Newsletter

# Weekly digest to confirmed newsletter subscribers — see
# docs/data-model.md's newsletter_subscribers entry and
# docs/roadmap.md's newsletter section for the full design.
#
# Moved Monday -> Sunday, 2026-08-23 (docs/roadmap.md's long-flagged
# "discovery cadence moves Monday -> Sunday") along with the rest of the
# discovery chain (event-discovery/headless/instagram/google-alerts, same
# relative stagger) — so the digest announces the week starting the next
# day, with a real one-day lead time, instead of the week that's already
# started.
#
# Time ALSO moved within that Sunday run, from 08:00 UTC to 10:00 UTC —
# real bug, found 2026-08-23: this was originally "1h after
# headless-bright-sources.yml" (07:00 UTC) when headless was the last
# step in the chain, but instagram-bright-sources.yml (08:00 UTC) and
# google-alerts-bright-source.yml (09:00 UTC) were added later without
# ever moving this cron — for weeks, the newsletter ran AT THE SAME TIME
# as instagram-bright-sources instead of after the full chain, so it
# never had that week's Instagram- or Google-Alerts-sourced events. Now
# scheduled 1h after google-alerts (the actual last step).
on:
  workflow_dispatch: {}
  schedule:
    # Not minute 0 — see event-discovery.yml's own comment (top-of-hour
    # congestion, real 26-51min delays observed 2026-08-23).
    - cron: "27 10 * * 0" # Every Sunday, ~10:27 UTC — 1h after google-alerts-bright-source.yml, the last step in the discovery chain

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Send weekly newsletter
        run: pnpm --filter @caldearte/curator run send-newsletter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
