name: Send Weekly Newsletter

# Weekly digest to confirmed newsletter subscribers — see
# docs/data-model.md's newsletter_subscribers entry and
# docs/roadmap.md's newsletter section for the full design.
#
# Since 2026-10-16: a Thursday-evening WEEKEND edition (Friday-Sunday),
# not a Sunday digest of the whole week — the Sunday send went out knowing
# only ~60% of its week's openings (venues announce late), while by
# Thursday 20:00 ~83% of the weekend is in. See
# apps/curator/src/newsletter/run.ts (weekendBoundsInSantiago; it only
# sends Thursday-Saturday). Earlier history: moved Monday -> Sunday
# 2026-08-23, then placed after the whole discovery chain.
#
# Timing: same approach as publish-social.yml. GitHub's schedule runs
# 2-10 h late, so the cron is set for 11:30 Santiago and the first step
# sleeps until 19:00 — by then that day's Instagram run (08:17 UTC cron,
# observed up to ~9.7 h late, i.e. done by ~15:00 Santiago) is in.
on:
  workflow_dispatch: {}
  schedule:
    # Not minute 0 — see event-discovery.yml's own comment (top-of-hour
    # congestion, real 26-51min delays observed 2026-08-23).
    # 14:30 UTC = 11:30 Santiago in summer time, 10:30 in winter — the
    # wait step below targets 19:00 in Santiago either way.
    - cron: "30 14 * * 4" # Every Thursday

permissions:
  contents: read

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    # GitHub's own limit; the wait below is capped well under it.
    timeout-minutes: 360
    steps:
      # Only on the schedule — a manual or watchdog dispatch sends at once.
      # Capped at 5h40m so a punctual GitHub can't push the job past its
      # 6h limit. After 19:00 there's no wait.
      - name: Wait until 19:00 in Santiago
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=America/Santiago date -d "19:00" +%s)
          wait=$(( target - $(date +%s) ))
          max=$(( 5 * 3600 + 40 * 60 ))
          if [ "$wait" -gt "$max" ]; then wait=$max; fi
          if [ "$wait" -gt 0 ]; then
            echo "Started $(TZ=America/Santiago date +%H:%M) Santiago; waiting $(( wait / 60 )) min."
            sleep "$wait"
          else
            echo "Started $(TZ=America/Santiago date +%H:%M) Santiago, past 19:00 — no wait."
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Send the weekend newsletter
        run: pnpm --filter @caldearte/curator run send-newsletter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
