name: Test Business Discovery (temporary, read-only)

# One-off manual dispatch, 2026-09-30 — NOT a recurring cron, NOT part of
# any pipeline. Read-only GET against the Graph API's business_discovery
# field to check whether it can read OTHER public Business/Creator
# accounts' recent media without Apify. See
# apps/curator/src/lib/test-business-discovery.ts. Deleted right after
# this one test run.
on:
  workflow_dispatch: {}

jobs:
  test-business-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test business_discovery against 3 registered accounts
        run: pnpm --filter @caldearte/curator exec tsx src/lib/test-business-discovery.ts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
