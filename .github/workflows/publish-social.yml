name: Publish Instagram Social Posts

# Automated "agenda" carousel — see docs/roadmap.md's Fase 4 section for
# the full design (redesigned 2026-08-31, Camila's "bitácora" request: one
# mixed inauguraciones+visitas-guiadas carousel, no repeats, short
# non-overlapping date windows instead of a weekly dump — see
# apps/curator/src/social-publish/selection.ts's own doc comment).
# apps/curator/src/social-publish/run.ts itself decides whether today
# actually publishes anything: only Monday/Wednesday/Friday post, and only
# if their window has something eligible — every other day (including this
# cron's own off days) is a deliberate no-op. No more per-type scheduling
# to juggle here — there's only one carousel shape now, so a single daily
# cron restricted to Mon/Wed/Fri is enough (the old Sunday-3-crons
# workaround for spacing 3 types across one day no longer applies).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — verify credentials/build the carousel but don't actually publish to Instagram"
        type: boolean
        default: true
  schedule:
    # Not minute 0 — GitHub's own docs flag the top of every hour as the
    # highest-congestion time for scheduled workflows; real 45+ minute
    # delays were observed across every cron in this repo 2026-08-23.
    - cron: "5 12 * * 1,3,5" # Monday, Wednesday, Friday, ~12:05 UTC

jobs:
  publish-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish scheduled Instagram carousel
        run: pnpm --filter @caldearte/curator run publish-social
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          # Only set on a manual run — a real scheduled run always
          # publishes for real, with today's actual window. github.event.inputs
          # is empty (not "true"/"false") on a schedule trigger, so DRY_RUN
          # correctly evaluates to false there via run.ts's own "=== 'true'" check.
          DRY_RUN: ${{ inputs.dry_run }}
