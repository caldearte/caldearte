name: Publish Instagram Social Posts

# Automated Feed carousels — see docs/roadmap.md's Fase 4 section for the
# full design. Runs every day; apps/curator/src/social-publish/run.ts
# itself decides whether today actually publishes anything (Sunday posts
# all 3 carousel types, Monday/Wednesday/Friday post one each, every
# other day is a deliberate no-op) — so this workflow's schedule is
# intentionally daily, not per-type.
#
# 12:00 UTC — chosen to run comfortably after event-discovery.yml/
# headless/instagram/google-alerts/weekly-newsletter's own Sunday chain
# (finishes ~10:00-10:15 UTC as of 2026-08-23's Monday -> Sunday shift,
# docs/roadmap.md), so Sunday's triple post (all 3 carousel types) uses
# that same morning's freshest curated events, and Monday's inauguración
# post has a real day of lead time on top of that.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — verify credentials/build the carousel(s) but don't actually publish to Instagram"
        type: boolean
        default: true
      force_types:
        description: "Comma-separated post types to test regardless of today's day-of-week (inauguracion,no_te_la_pierdas,destacada) — leave empty to use today's real schedule"
        type: string
        default: ""
  schedule:
    - cron: "0 12 * * *" # Every day, 12:00 UTC

jobs:
  publish-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish scheduled Instagram carousels
        run: pnpm --filter @caldearte/curator run publish-social
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          # Only set on a manual run — a real scheduled run always
          # publishes for real, with today's actual schedule. github.event.inputs
          # is empty (not "true"/"false") on a schedule trigger, so DRY_RUN
          # correctly evaluates to false there via run.ts's own "=== 'true'" check.
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_TYPES: ${{ inputs.force_types }}
