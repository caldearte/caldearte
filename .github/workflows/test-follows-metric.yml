name: Test Follows Metric (temporary, read-only)

# One-off manual dispatch, 2026-09-29 — NOT a recurring cron, NOT part of
# any pipeline. Read-only GET against the Graph API to check whether the
# `follows` media-insights metric works for a REEL (Meta's own docs table
# only lists it for FEED/STORY). See
# apps/curator/src/lib/test-follows-metric.ts. Deleted right after this
# one test run — see docs/roadmap.md Phase 4 for what it's feeding into.
on:
  workflow_dispatch: {}

jobs:
  test-follows-metric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test the follows metric for a reel vs a carousel
        run: pnpm --filter @caldearte/curator exec tsx src/lib/test-follows-metric.ts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
