name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  # Manual re-run, for when a deploy failed for reasons outside the migration
  # itself (2026-11-19: CLI 3.x changed db push's default target).
  workflow_dispatch:

# Avoid two pushes racing to apply migrations against production at once.
concurrency:
  group: supabase-deploy-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # SUPABASE_ACCESS_TOKEN (an account-wide personal token) and
    # SUPABASE_DB_PASSWORD live as secrets of this environment, not of the
    # repo, so no other workflow (and none of their pnpm dependencies) can
    # read them (security review 2026-11-22, M4). While the repo-level
    # copies still exist they're used as a fallback.
    environment: production-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # Pinned: `latest` picked up a CLI whose `db push` targets the local
          # stack by default, and the 2026-11-19 deploy failed. Bump on purpose.
          version: 3.2.0

      - name: Link production project
        run: supabase link --project-ref wtuhloeyotjthvmvxmxj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        run: supabase db push --remote --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
