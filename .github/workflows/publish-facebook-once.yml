name: Publish Facebook Once (temporary, manual)

# One-off manual dispatch, 2026-09-25 — NOT a recurring cron. Publishes
# apps/curator/src/social-publish/publish-once.ts's fixed announcement to
# the Facebook Page, isolated from the daily Instagram+Facebook carousel
# in publish-social.yml. This workflow file is temporary and gets deleted
# right after this one post — see run.ts/facebook.ts for the real,
# permanent daily pipeline.
on:
  workflow_dispatch: {}

jobs:
  publish-facebook-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish the one-off Facebook announcement
        run: pnpm --filter @caldearte/curator exec tsx src/social-publish/publish-once.ts
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
