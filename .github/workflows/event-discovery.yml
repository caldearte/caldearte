name: Run Event Discovery

# Comuna batch (Tavily) PAUSED 2026-08-23 — real data, not a hunch: as of
# this date, ZERO currently-live events in `events` have
# pipeline='comuna_search', and ZERO rows in `rejected_candidates` do
# either — months of monthly full runs produced not one real event,
# approved or rejected, while costing a real, measured ~$16.48 in Haiku
# spend (api_usage_log) plus Tavily credits. bright_source (90 live
# events) and instagram (42 live events) cost cents per run by comparison
# and actually work. The monthly "1st of the month, 06:00 UTC" full-run
# cron (comuna batch + any due bright sources swept in) is removed
# entirely — only the weekly bright-sources-only cron remains (moved to
# Sunday the same day, see below), since that's the cadence doing all the
# real work. The comuna-search
# CODE itself (searchUnitFn, getUnitsDueForRun, etc.) is deliberately
# left in place, not deleted — reachable via workflow_dispatch with
# bright_sources_only=false if this ever needs to be re-investigated or
# re-enabled, rather than requiring a revert.
#
# Every Sunday, ~06:07 UTC: bright_sources_only — every bright source
# processed, no per-source cadence gate anymore (removed 2026-08-24, see
# dueBrightSources' own doc comment in run.ts — the real cost driver,
# Haiku only seeing genuinely new items, is handled by per-item dedup
# regardless of fetch frequency, and the plain fetch()/Tavily-free bright
# sources have no real per-check cost either). Moved from Monday to
# Sunday 2026-08-23 (docs/roadmap.md's long-flagged "discovery cadence
# moves Monday -> Sunday") along with the rest of this chain (headless/
# instagram/google-alerts + the newsletter, same relative stagger) — so
# a week's events are discovered and curated the day *before* that week
# starts, giving Sunday's newsletter and IG drop a real one-day lead time
# instead of announcing Monday's inauguraciones the same day they happen.
#
# Added a second weekly run, Wednesday ~06:07 UTC, 2026-08-24 — same
# stagger as Sunday, finishing well before Mon/Wed/Fri's own
# publish-social.yml post at 12:05 UTC. Daniel: since cadence removal
# means checking twice a week costs basically the same as once, and
# Wednesday's own post ("no te la pierdas") was otherwise only ever
# working off whatever the PREVIOUS Sunday found — anything announced
# Mon/Tue was invisible to it until the following Sunday. This closes
# that gap without adding a newsletter run (the newsletter stays
# Sunday-only, a deliberate weekly digest, not a discovery-frequency
# question).
# workflow_dispatch stays available for a manual run any time, with its
# own explicit bright_sources_only input (used instead of
# github.event.schedule when NOT a schedule-triggered run). bright_source_urls
# (2026-07-23) debugs one or a few named sources on demand — comma-separated
# substrings matched against each source's own url, ignoring its normal
# 7-day cadence entirely (e.g. "arteinformado.com,parquecultural.cl" to
# retry two known-flaky sources and see their real logs without waiting or
# resetting every other source's fetch state too).
#
# Requires the TAVILY_API_KEY repo secret (searches run via Tavily, not
# Anthropic's web_search tool — see docs/region-discovery.md). Still
# needed for a manual full run via workflow_dispatch even though nothing
# schedules one automatically anymore.
#
# RESEND_API_KEY (2026-07-19) is optional: without it, the post-run summary
# email just logs a warning and no-ops — the run itself still succeeds.
# Independent from apps/web's Vercel env var of the same name (different
# secret store) — see docs/region-discovery.md's cost-governance section.
on:
  workflow_dispatch:
    inputs:
      bright_sources_only:
        description: "Skip the comuna batch, only refresh due bright sources"
        type: boolean
        default: false
      bright_source_urls:
        description: "Debug specific bright source(s): comma-separated URL substrings (e.g. arteinformado.com,parquecultural.cl) — ignores their own fetch cadence, implies bright_sources_only"
        type: string
        default: ""
  schedule:
    # Not minute 0 — GitHub's own docs flag the top of every hour as the
    # highest-congestion time for scheduled workflows (most repos default
    # cron minutes to 0), causing real delays; a real 51-minute delay was
    # observed 2026-08-23, this repo's first Sunday run under the new
    # schedule. Every cron in this repo was moved off :00 the same day.
    - cron: "7 6 * * 0" # every Sunday, ~06:07 UTC — bright sources only
    - cron: "7 6 * * 3" # every Wednesday, ~06:07 UTC — bright sources only, feeds that day's own "no te la pierdas" post

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Event Discovery
        run: pnpm --filter @caldearte/curator run discover-events
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Only one schedule trigger left (the weekly Sunday bright-only
          # run) since the comuna batch's monthly cron was removed — a
          # schedule-triggered run is always bright_sources_only now, no
          # need to branch on github.event.schedule anymore.
          BRIGHT_SOURCES_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bright_sources_only || 'true' }}
          BRIGHT_SOURCE_URLS: ${{ github.event.inputs.bright_source_urls }}
