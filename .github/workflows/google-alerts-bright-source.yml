name: Run Google Alerts Bright Source

# Separate, deferred workflow for the Google Alerts bright source (a real
# "inauguracion de arte" alert of Daniel's, evaluated 2026-08-14 — see
# apps/curator/src/lib/google-alerts.ts). Deliberately its OWN workflow,
# same reasoning as headless-bright-sources.yml/instagram-bright-sources.yml:
# keeps this off the main run's already-tight GitHub Actions budget, AND —
# specific to this source — makes it trivial to pause/disable entirely
# (just disable this workflow) without touching anything else, given each
# entry here points to an arbitrary, unrelated domain (not one known,
# reviewed site).
#
# No TAVILY_API_KEY: this flow never searches — the Google Alert itself is
# the search, already running continuously on Google's own infrastructure,
# for free. This workflow only reads its feed and curates what's new.
#
# Cadence: none (removed 2026-08-24, same as every other bright source) —
# runs every time its own cron fires, no per-item gate needed here either
# way (one continuously-updating feed, not many independently-paced
# accounts).
#
# Back to Sunday-only, 2026-08-26 — the Wednesday cron (added 2026-08-24)
# is dropped again: unlike Instagram, this source has no real same-day
# urgency (a Google Alert email is itself an aggregator with inherent
# latency, not a same-day "inauguración hoy" post), and real run data
# showed low volume/cost here — not worth the extra weekly run.
on:
  workflow_dispatch: {}
  schedule:
    # Not minute 0 — see event-discovery.yml's own comment (top-of-hour
    # congestion, real 26-51min delays observed 2026-08-23).
    - cron: "22 9 * * 0" # Every Sunday, ~09:22 UTC — 1h after Instagram

jobs:
  discover-google-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Google Alerts bright source
        run: pnpm --filter @caldearte/curator run discover-google-alerts-source
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_ALERTS_FEED_URL: ${{ secrets.GOOGLE_ALERTS_FEED_URL }}
