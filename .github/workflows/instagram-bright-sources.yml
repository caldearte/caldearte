name: Run Instagram Bright Sources

# Separate, deferred workflow for Instagram bright sources — public
# accounts fetched via Apify (apps/curator/src/lib/apify-instagram.ts),
# since Instagram blocks anonymous/headless fetch of profile pages (see
# apps/curator/src/lib/page-fetch.ts). Deliberately its OWN workflow, same
# reasoning as headless-bright-sources.yml (MAVI): keeps this off the main
# run's already-tight GitHub Actions budget, AND — specific to this
# source — makes it trivial to pause/disable entirely (just disable this
# workflow) without touching anything else, given this source's different
# risk profile (third-party scraping of a social platform).
#
# No TAVILY_API_KEY: this flow never searches, only fetches + curates
# already-known accounts, same as headless-bright-sources.yml.
#
# No per-account cadence gate anymore, 2026-08-24 (see
# instagram-fetch-state.ts's own doc comment) — every account is checked
# on every cron fire. Real data showed Apify's actor is pay-per-RESULT,
# not per-account-queried, so checking more often costs the same ~$0 for
# a quiet account — the same-week comparison confirmed this directly
# against the real Apify dashboard, 2026-08-26 (see below).
#
# Bumped from twice-weekly (Sun/Wed) to every 2 days, 2026-08-26 — real
# evidence: 2 genuine same-day inauguraciones (posted and opening the
# same day) were lost purely because that day fell in the Sun→Wed gap,
# already expired by the time the next scheduled run saw them
# (event-discovery/run.ts's own "expired before insertion" backstop
# correctly declined to show them as upcoming — not a bug, a real
# cadence gap). Confirmed against Apify's real usage dashboard the same
# day ($4.21/$5.00 free tier, matching platform_cost_snapshots exactly)
# that total weekly result volume is bounded by real posting activity,
# not check frequency — Apify cost shouldn't meaningfully rise from
# this. `1-31/2` (every odd day-of-month) is an approximation of "every
# 2 days" — cron has no native N-day step, and this occasionally yields
# a 1-day gap across a month boundary (day 31 → day 1), acceptable given
# the real goal is closing the multi-day gap, not exact parity.
on:
  workflow_dispatch: {}
  schedule:
    # Not minute 0 — see event-discovery.yml's own comment (top-of-hour
    # congestion, real 26-51min delays observed 2026-08-23).
    #
    # Day-of-week pinned to Sunday (0) instead of `*`, 2026-08-30 —
    # cron's real semantics: when BOTH day-of-month and day-of-week are
    # restricted (neither is `*`), a day matches if it satisfies EITHER
    # field, not both (a POSIX cron quirk, not GitHub-specific). So this
    # still fires every 2 days via `1-31/2`, AND is now guaranteed to
    # additionally fire every Sunday even when that Sunday lands on an
    # even day-of-month — closing a real gap: the Sunday newsletter
    # chain (event-discovery 06:07 → headless 07:12 → google-alerts
    # 09:22 → weekly-newsletter 10:27, all UTC) assumed Instagram always
    # ran that morning too, but on an even-day Sunday it silently
    # didn't, and the newsletter went out without that week's IG-sourced
    # events. A single cron entry, not a second schedule alongside this
    # one, so an odd-day Sunday still fires exactly once, not twice.
    - cron: "17 8 1-31/2 * 0" # Every 2 days, ~08:17 UTC — always including Sunday

jobs:
  discover-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Instagram bright sources
        run: pnpm --filter @caldearte/curator run discover-instagram-sources
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
