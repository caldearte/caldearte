name: Run Instagram Bright Sources

# Separate, deferred workflow for Instagram bright sources — public
# accounts fetched via Apify (apps/curator/src/lib/apify-instagram.ts),
# since Instagram blocks anonymous/headless fetch of profile pages (see
# apps/curator/src/lib/page-fetch.ts). Deliberately its OWN workflow, same
# reasoning as headless-bright-sources.yml (MAVI): keeps this off the main
# run's already-tight GitHub Actions budget, AND — specific to this
# source — makes it trivial to pause/disable entirely (just disable this
# workflow) without touching anything else, given this source's different
# risk profile (third-party scraping of a social platform).
#
# No TAVILY_API_KEY: this flow never searches, only fetches + curates
# already-known accounts, same as headless-bright-sources.yml.
#
# Cron fires weekly, but each account's own due-check
# (instagram-discovery/run.ts's isInstagramSourceDue) only allows a fetch
# every 14 days — a weekly cron against a 14-day per-account cadence just
# means a given account's actual fetch happens on every OTHER run, same
# established pattern as event-discovery/run.ts's own bright sources
# (weekly cron, 14-day BRIGHT_SOURCE_INTERVAL_MS). Daniel's explicit
# request (2026-08-13): Instagram content turns over slower, and each
# fetch is real Apify spend, so a longer cadence than the plain-HTML
# bright sources is worth it here specifically.
on:
  workflow_dispatch: {}
  schedule:
    # Not minute 0 — see event-discovery.yml's own comment (top-of-hour
    # congestion, real 26-51min delays observed 2026-08-23).
    - cron: "17 8 * * 0" # Every Sunday, ~08:17 UTC — 1h after headless (moved from Monday 2026-08-23, see event-discovery.yml)

jobs:
  discover-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Instagram bright sources
        run: pnpm --filter @caldearte/curator run discover-instagram-sources
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
