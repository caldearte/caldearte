name: Run Instagram Bright Sources

# Separate, deferred workflow for Instagram bright sources — public
# accounts fetched via Apify (apps/curator/src/lib/apify-instagram.ts),
# since Instagram blocks anonymous/headless fetch of profile pages (see
# apps/curator/src/lib/page-fetch.ts). Deliberately its OWN workflow, same
# reasoning as headless-bright-sources.yml (MAVI): keeps this off the main
# run's already-tight GitHub Actions budget, AND — specific to this
# source — makes it trivial to pause/disable entirely (just disable this
# workflow) without touching anything else, given this source's different
# risk profile (third-party scraping of a social platform).
#
# No TAVILY_API_KEY: this flow never searches, only fetches + curates
# already-known accounts, same as headless-bright-sources.yml.
#
# No per-account cadence gate anymore, 2026-08-24 (see
# instagram-fetch-state.ts's own doc comment) — every account is checked
# on every cron fire.
#
# Bumped from twice-weekly (Sun/Wed) to every 2 days, 2026-08-26 — real
# evidence: 2 genuine same-day inauguraciones (posted and opening the
# same day) were lost purely because that day fell in the Sun→Wed gap,
# already expired by the time the next scheduled run saw them
# (event-discovery/run.ts's own "expired before insertion" backstop
# correctly declined to show them as upcoming — not a bug, a real
# cadence gap).
#
# Reverted back to twice-weekly (Sun/Wed), 2026-08-30 — the every-2-days
# cadence hit Apify's real $5/mo free-tier hard limit mid-month (confirmed
# against platform_cost_snapshots: ~$0.75/run against the full account
# registry, no per-account gating — roughly $11/mo at every-2-days versus
# ~$5-6/mo at twice-weekly). Daniel's explicit call: no real usage signal
# yet (IG followers/web traffic/newsletter subscribers) to justify paying
# past the free tier, so cadence trades back some same-day-inauguración
# coverage for staying free. Revisit once there's a real usage signal —
# see project memory. Paired with instagram-fetch-state.ts's
# DEFAULT_INTERVAL_DAYS drop (7→4) so a newly-added account's cutoff
# doesn't drag the whole batch's shared onlyPostsNewerThan back to a full
# week (the same-day comparison this run logs — "N post(s) already seen,
# skipped before curation" — showed real re-fetched/re-billed waste from
# that wider-than-needed window).
#
# Daily Mon-Sat, 2026-09-13 — the third cadence change, this time with
# measurements instead of a hunch. Post creation times decoded from every
# approved event's Instagram shortcode (85 inauguraciones) showed: venues
# post Mon-Fri (Friday alone 28%), openings cluster Thu-Sat (78%), and the
# Sun/Wed cadence saw only 74% of inauguraciones BEFORE they happened —
# mostly Friday posts about Saturday openings, first seen on Sunday. Daily
# Mon-Sat lifts that to ~93% (Sunday posts are 2%, not worth a 7th run).
# Cost: Apify bills per post fetched, never per call, and each account's
# cutoff is its own last fetch, so more runs re-fetch nothing — the real
# free-tier pressure is the size of the account registry, not the
# cadence (see instagram-fetch-state.ts's groupAccountsByCutoff for the
# one genuine re-billing leak, fixed the same day). Paired with
# ZERO_YIELD_CHECKS_BEFORE_INACTIVE 52 → 156 so the dormancy backstop
# still means ~6 months at 6 checks/week, and cron-watchdog.yml's
# max_gap_hours for this workflow 120 → 54 (worst gap Sat → Mon, 48h).
on:
  workflow_dispatch: {}
  schedule:
    # Not minute 0 — see event-discovery.yml's own comment (top-of-hour
    # congestion, real 26-51min delays observed 2026-08-23). Same Sun/Wed
    # slot this ran at before the 2026-08-26 cadence bump — 1h after
    # headless-bright-sources.yml (07:12), 1h before google-alerts-
    # bright-source.yml (09:22, whose own comment still says "1h after
    # Instagram" — this keeps that true).
    - cron: "17 8 * * 1-6" # Every Monday through Saturday, ~08:17 UTC

jobs:
  discover-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Instagram bright sources
        run: pnpm --filter @caldearte/curator run discover-instagram-sources
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Shadow-mode model comparison pilot (2026-09-04) — optional: if
          # unset, apps/curator/src/lib/model-comparison.ts no-ops entirely.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
